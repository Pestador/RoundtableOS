<template id="template-idea-detail">
  <section class="p-6 md:p-10 lg:p-12 max-w-7xl mx-auto w-full space-y-8">
    <header class="flex flex-col xl:flex-row xl:items-start justify-between gap-6">
      <div class="space-y-4">
        <div class="flex flex-wrap items-center gap-3">
          <div data-idea-detail-stage></div>
          <span
            class="text-on-surface-variant text-sm uppercase tracking-[0.12em]"
            data-idea-detail-meta
          ></span>
        </div>
        <div class="space-y-3">
          <h1
            class="font-headline text-4xl md:text-5xl font-extrabold tracking-tight"
            data-idea-detail-title
          ></h1>
          <p
            class="text-2xl text-on-surface-variant max-w-4xl leading-relaxed"
            data-idea-detail-summary
          ></p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button
          type="button"
          data-action="toggle-idea-edit"
          class="px-5 py-3 rounded-lg ghost-border text-primary font-medium hover:bg-surface-container-low transition-all duration-200 ease-in-out"
        >
          Edit Details
        </button>
        <button
          type="button"
          data-action="launch-brainstorm-from-detail"
          class="px-6 py-3 rounded-lg bg-gradient-primary text-on-primary ambient-shadow font-medium hover:opacity-90 transition-all duration-200 ease-in-out"
        >
          Launch Spark
        </button>
      </div>
    </header>

    <div class="border-b border-outline-variant/20">
      <div class="flex flex-wrap gap-6 text-lg">
        <button
          type="button"
          data-idea-detail-tab="overview"
          class="pb-4 border-b-2 border-primary text-primary font-medium"
        >
          Overview &amp; Core
        </button>
        <button
          type="button"
          data-idea-detail-tab="sessions"
          class="pb-4 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface transition-all duration-200 ease-in-out"
        >
          Session History
        </button>
        <button
          type="button"
          data-idea-detail-tab="tasks"
          class="pb-4 border-b-2 border-transparent text-on-surface-variant hover:text-on-surface transition-all duration-200 ease-in-out"
        >
          Tasks &amp; Plan
        </button>
      </div>
    </div>

    <div class="grid xl:grid-cols-[minmax(0,1fr)_340px] gap-8 items-start">
      <div
        class="space-y-8"
        data-idea-detail-main
      ></div>

      <aside class="space-y-6">
        <div
          class="editorial-card p-7 space-y-6"
          data-idea-detail-score
        ></div>
        <div
          class="editorial-card p-7 space-y-5"
          data-idea-detail-side-resources
        ></div>
      </aside>
    </div>
  </section>
</template>
