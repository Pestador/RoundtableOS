<script>
  (function () {
    var NAV_ITEMS = [
      { key: 'dashboard', label: 'Dashboard', icon: 'dashboard', hash: '#dashboard' },
      { key: 'ideas', label: 'Ideas', icon: 'lightbulb', hash: '#ideas' },
      { key: 'brainstorm', label: 'Brainstorming', icon: 'psychology', hash: '#brainstorm' },
      { key: 'resources', label: 'Resource Vault', icon: 'inventory_2', hash: '#resources' },
      { key: 'tasks', label: 'Task Manager', icon: 'checklist', hash: '#tasks' },
      { key: 'settings', label: 'Settings', icon: 'settings', hash: '#settings' },
    ];

    var IDEA_STAGES = [
      'Inbox',
      'Spark',
      'Exploring',
      'Validating',
      'Planned',
      'Building',
      'Launched',
      'Paused',
      'Archived',
      'Killed',
    ];

    var TASK_COLUMNS = ['Todo', 'InProgress', 'Blocked', 'Done'];
    var RESOURCE_TYPES = ['All Items', 'App', 'AI Model', 'Book', 'Video', 'Dataset', 'Tool', 'Documentation', 'Design Asset'];
    var RESOURCE_STATUSES = ['All Statuses', 'Saved', 'Tested', 'Useful', 'Revisit', 'Deprecated'];
    var SETTINGS_PROVIDER_META = {
      deepseek: { label: 'DeepSeek', keyStatusField: 'hasDeepSeekApiKey' },
      gemini: { label: 'Gemini', keyStatusField: 'hasGeminiApiKey' },
      openrouter: { label: 'OpenRouter', keyStatusField: 'hasOpenRouterApiKey' },
      openai: { label: 'OpenAI', keyStatusField: 'hasOpenAiApiKey' },
      anthropic: { label: 'Anthropic', keyStatusField: 'hasAnthropicApiKey' },
    };

    var TASK_STATUS_LABELS = {
      Todo: 'Todo',
      InProgress: 'In Progress',
      Blocked: 'Blocked',
      Done: 'Done',
    };

    var STAGE_META = {
      Inbox: {
        badge: 'bg-surface-container-highest text-on-surface-variant',
        accent: 'bg-surface-container-highest',
      },
      Spark: {
        badge: 'bg-primary-container text-on-primary-container',
        accent: 'bg-primary',
      },
      Exploring: {
        badge: 'bg-secondary-container text-on-secondary-container',
        accent: 'bg-secondary',
      },
      Validating: {
        badge: 'bg-tertiary-container text-on-tertiary-container',
        accent: 'bg-secondary',
      },
      Planned: {
        badge: 'bg-primary-container text-primary',
        accent: 'bg-tertiary',
      },
      Building: {
        badge: 'bg-primary-container text-on-primary-container',
        accent: 'bg-primary',
      },
      Launched: {
        badge: 'bg-secondary-container text-secondary',
        accent: 'bg-secondary',
      },
      Paused: {
        badge: 'bg-surface-container-high text-outline',
        accent: 'bg-surface-container-high',
      },
      Archived: {
        badge: 'bg-surface-container-highest text-on-surface-variant',
        accent: 'bg-surface-container-highest',
      },
      Killed: {
        badge: 'bg-error-container text-on-error-container',
        accent: 'bg-error',
      },
    };

    var PERSONA_META = {
      Kai: { initial: 'K', role: 'Visionary', line: 'bg-primary', pill: 'bg-primary text-on-primary', text: 'text-primary' },
      Nova: { initial: 'N', role: 'Strategist', line: 'bg-secondary', pill: 'bg-secondary text-on-secondary', text: 'text-secondary' },
      Rex: { initial: 'R', role: 'Builder', line: 'bg-tertiary', pill: 'bg-tertiary text-on-tertiary', text: 'text-tertiary' },
      Sage: { initial: 'S', role: 'Critic', line: 'bg-error', pill: 'bg-error text-on-error', text: 'text-error' },
      Luna: {
        initial: 'L',
        role: 'User Advocate',
        line: 'bg-primary-container',
        pill: 'bg-primary-container text-on-primary-container',
        text: 'text-on-primary-container',
      },
      Nia: {
        initial: 'N',
        role: 'Execution Controller',
        line: 'bg-outline',
        pill: 'bg-outline-variant text-on-surface',
        text: 'text-on-surface-variant',
      },
      Synthesis: {
        initial: 'Σ',
        role: 'Synthesis',
        line: 'bg-primary',
        pill: 'bg-primary-container text-on-primary-container',
        text: 'text-primary',
      },
    };

    var BRAINSTORM_MODES = {
      'Full Roundtable': {
        personas: ['Kai', 'Nova', 'Rex', 'Sage', 'Luna', 'Nia'],
        description: 'All six personas weigh in sequentially for the most complete view.',
      },
      'Quick Spark': {
        personas: ['Kai', 'Rex'],
        description: 'A fast pass for creative direction plus practical build thinking.',
      },
      'Challenge Mode': {
        personas: ['Sage', 'Luna'],
        description: 'Pressure-test the idea through critique and user empathy.',
      },
      'Strategy Deep-Dive': {
        personas: ['Nova', 'Nia'],
        description: 'Focus on the commercial angle and the next execution move.',
      },
    };

    var App = {
      state: {
        settings: null,
        dashboard: null,
        ideas: null,
        resources: null,
        tasks: null,
        sessionHistory: null,
        activeSession: null,
        dragging: null,
        drawerHtml: '',
        modalHtml: '',
        sessionAutoplayTimer: null,
        typingTimer: null,
        liveTyping: null,
        personaUploads: {},
        brainstormAutoDelayMs: 1100,
        ui: {
          ideasView: 'list',
          ideasSearch: '',
          ideasSort: 'PriorityScore',
          ideaStage: 'All',
          resourcesView: 'cards',
          resourceType: 'All Items',
          resourceStatus: 'All Statuses',
          resourceSearch: '',
          taskSearch: '',
          taskIdeaFilter: 'All Ideas',
          taskAssigneeFilter: '',
          taskDueFilter: 'All',
          ideaDetailTab: 'overview',
          ideaDetailEditing: false,
          brainstormMode: 'Full Roundtable',
          brainstormHistoryIdeaId: '',
          brainstormIdeaId: '',
          globalSearch: '',
        },
      },
      init: init,
      loadRoute: loadRoute,
      invalidate: invalidate,
    };

    window.RTOSApp = App;

    document.addEventListener('DOMContentLoaded', init);

    function init() {
      bindEvents_();
      var outlet = document.getElementById('route-outlet');
      if (!window.location.hash) {
        var initial = outlet && outlet.dataset ? outlet.dataset.initialPage : 'dashboard';
        window.history.replaceState(null, '', '#' + (initial || 'dashboard'));
      }
      bootstrap_();
    }

    async function bootstrap_() {
      renderShell_();
      renderLoadingRoute_('Preparing the Roundtable workspace...');
      try {
        await AppApi.setupSpreadsheet();
        App.state.settings = await AppApi.getSettings();
        applyTheme_(String(App.state.settings.darkModeEnabled) === 'true');
        renderShell_();
        await loadRoute(true);
      } catch (error) {
        renderFatalState_(error);
        showToast_(error.message || 'Failed to initialize the app.', 'error');
      }
    }

    async function loadRoute(force) {
      try {
        var previousRoute = App.state.route;
        var route = parseHash_(window.location.hash);
        App.state.route = route;
        if (route.name !== 'brainstorm') {
          clearLiveBrainstormEffects_();
        }
        if (
          route.name !== 'idea-detail' ||
          !previousRoute ||
          previousRoute.name !== 'idea-detail' ||
          previousRoute.params.id !== route.params.id
        ) {
          App.state.ui.ideaDetailEditing = false;
        }
        renderShell_();
        closeDrawer_();
        renderLoadingRoute_('Loading view...');

        if (route.name === 'dashboard') {
          await ensureDashboard_(force);
          renderDashboard_();
          return;
        }

        if (route.name === 'ideas') {
          await ensureIdeas_(force);
          renderIdeas_();
          return;
        }

        if (route.name === 'ideas-new') {
          renderTemplateIntoOutlet_('template-new-spark');
          return;
        }

        if (route.name === 'idea-detail') {
          await renderIdeaDetail_(route.params.id, force);
          return;
        }

        if (route.name === 'brainstorm-history') {
          await Promise.all([ensureIdeas_(force), ensureSessionHistory_(force)]);
          renderBrainstormHistory_();
          return;
        }

        if (route.name === 'brainstorm') {
          await Promise.all([ensureIdeas_(force), ensureSessionHistory_(force)]);
          await renderBrainstormRoute_(route, force);
          return;
        }

        if (route.name === 'resources') {
          await Promise.all([ensureResources_(force), ensureIdeas_(force)]);
          renderResources_();
          return;
        }

        if (route.name === 'tasks') {
          await Promise.all([ensureTasks_(force), ensureIdeas_(force)]);
          renderTasks_();
          return;
        }

        if (route.name === 'settings') {
          await ensureSettings_(force);
          renderSettings_();
          return;
        }

        window.location.hash = '#dashboard';
      } catch (error) {
        renderFatalState_(error);
        showToast_(error.message || 'Something went wrong while rendering the route.', 'error');
      }
    }

    function invalidate(keys) {
      (keys || []).forEach(function (key) {
        App.state[key] = null;
      });
    }

    function bindEvents_() {
      window.addEventListener('hashchange', function () {
        if (App.state.settings) {
          loadRoute(false);
        }
      });

      document.addEventListener('click', function (event) {
        var navTarget = event.target.closest('[data-nav]');
        if (navTarget) {
          event.preventDefault();
          window.location.hash = navTarget.getAttribute('data-nav');
          return;
        }

        var actionTarget = event.target.closest('[data-action]');
        if (actionTarget) {
          event.preventDefault();
          handleAction_(actionTarget.getAttribute('data-action'), actionTarget);
          return;
        }

        var ideaViewTarget = event.target.closest('[data-ideas-view]');
        if (ideaViewTarget) {
          App.state.ui.ideasView = ideaViewTarget.getAttribute('data-ideas-view');
          renderIdeas_();
          return;
        }

        var stageFilterTarget = event.target.closest('[data-idea-stage-filter]');
        if (stageFilterTarget) {
          App.state.ui.ideaStage = stageFilterTarget.getAttribute('data-idea-stage-filter');
          renderIdeas_();
          return;
        }

        var ideaTabTarget = event.target.closest('[data-idea-detail-tab]');
        if (ideaTabTarget) {
          App.state.ui.ideaDetailTab = ideaTabTarget.getAttribute('data-idea-detail-tab');
          App.state.ui.ideaDetailEditing = false;
          loadRoute(false);
          return;
        }

        var resourceViewTarget = event.target.closest('[data-resources-view]');
        if (resourceViewTarget) {
          App.state.ui.resourcesView = resourceViewTarget.getAttribute('data-resources-view');
          renderResources_();
          return;
        }

        var resourceTypeTarget = event.target.closest('[data-resource-type]');
        if (resourceTypeTarget) {
          App.state.ui.resourceType = resourceTypeTarget.getAttribute('data-resource-type');
          renderResources_();
          return;
        }

        var resourceStatusTarget = event.target.closest('[data-resource-status]');
        if (resourceStatusTarget) {
          App.state.ui.resourceStatus = resourceStatusTarget.getAttribute('data-resource-status');
          renderResources_();
          return;
        }

        var brainstormModeTarget = event.target.closest('[data-brainstorm-mode]');
        if (brainstormModeTarget) {
          App.state.ui.brainstormMode = brainstormModeTarget.getAttribute('data-brainstorm-mode');
          renderBrainstormRoute_(App.state.route || parseHash_(window.location.hash), false);
          return;
        }

        var taskIdeaFilterTarget = event.target.closest('[data-task-idea-filter]');
        if (taskIdeaFilterTarget) {
          App.state.ui.taskIdeaFilter = taskIdeaFilterTarget.getAttribute('data-task-idea-filter');
          renderTasks_();
          return;
        }

        var taskDueFilterTarget = event.target.closest('[data-task-due-filter]');
        if (taskDueFilterTarget) {
          App.state.ui.taskDueFilter = taskDueFilterTarget.getAttribute('data-task-due-filter');
          renderTasks_();
        }
      });

      document.addEventListener('submit', function (event) {
        var form = event.target;
        if (!(form instanceof HTMLFormElement)) {
          return;
        }
        event.preventDefault();

        if (form.id === 'new-idea-form') {
          handleNewIdeaSubmit_(form);
          return;
        }
        if (form.id === 'settings-form') {
          handleSettingsSubmit_(form);
          return;
        }
        if (form.id === 'global-search-form') {
          var searchField = form.querySelector('[data-global-search]');
          App.state.ui.globalSearch = searchField ? searchField.value : '';
          App.state.ui.ideasSearch = App.state.ui.globalSearch;
          window.location.hash = '#ideas';
          return;
        }
        if (form.id === 'brainstorm-launch-form') {
          handleBrainstormLaunch_(form);
          return;
        }
        if (form.id === 'idea-page-edit-form' || form.id === 'idea-drawer-edit-form') {
          handleIdeaEditSubmit_(form);
          return;
        }
        if (form.id === 'resource-create-form') {
          handleResourceCreate_(form);
          return;
        }
        if (form.id === 'resource-edit-form') {
          handleResourceUpdate_(form);
          return;
        }
        if (form.id === 'task-create-form') {
          handleTaskCreate_(form);
          return;
        }
        if (form.id === 'task-edit-form') {
          handleTaskUpdate_(form);
        }
      });

      document.addEventListener('input', function (event) {
        var target = event.target;
        if (target.matches('[data-ideas-search]')) {
          App.state.ui.ideasSearch = target.value;
          renderIdeas_();
          return;
        }
        if (target.matches('[data-resource-search]')) {
          App.state.ui.resourceSearch = target.value;
          renderResources_();
          return;
        }
        if (target.matches('[data-task-search]')) {
          App.state.ui.taskSearch = target.value;
          renderTasks_();
        }
      });

      document.addEventListener('change', function (event) {
        var target = event.target;
        if (target.matches('[data-ideas-sort]')) {
          App.state.ui.ideasSort = target.value;
          renderIdeas_();
          return;
        }
        if (target.matches('[data-brainstorm-history-filter]')) {
          App.state.ui.brainstormHistoryIdeaId = target.value;
          renderBrainstormHistory_();
          return;
        }
        if (target.matches('[name="activeLlmProvider"]')) {
          syncSettingsProviderUi_(target.form, App.state.settings || {});
          return;
        }
        if (target.matches('[data-persona-avatar-input]')) {
          handlePersonaAvatarInput_(target);
        }
      });

      document.addEventListener('input', function (event) {
        var target = event.target;
        if (target.matches('[data-persona-name-input]')) {
          updatePersonaSettingsCardPreview_(target.closest('[data-persona-card]'));
        }
      });

      document.addEventListener('dragstart', function (event) {
        var item = event.target.closest('[data-drag-type]');
        if (!item) {
          return;
        }
        App.state.dragging = {
          type: item.getAttribute('data-drag-type'),
          id: item.getAttribute('data-drag-id'),
        };
        item.classList.add('opacity-50');
      });

      document.addEventListener('dragend', function (event) {
        var item = event.target.closest('[data-drag-type]');
        if (item) {
          item.classList.remove('opacity-50');
        }
        App.state.dragging = null;
      });

      document.addEventListener('dragover', function (event) {
        var target = event.target.closest('[data-drop-type]');
        if (!target || !App.state.dragging) {
          return;
        }
        if (target.getAttribute('data-drop-type') === App.state.dragging.type) {
          event.preventDefault();
        }
      });

      document.addEventListener('drop', function (event) {
        var target = event.target.closest('[data-drop-type]');
        if (!target || !App.state.dragging) {
          return;
        }
        if (target.getAttribute('data-drop-type') !== App.state.dragging.type) {
          return;
        }
        event.preventDefault();
        if (App.state.dragging.type === 'idea') {
          handleIdeaDrop_(App.state.dragging.id, target.getAttribute('data-drop-stage'));
          return;
        }
        if (App.state.dragging.type === 'task') {
          handleTaskDrop_(App.state.dragging.id, target.getAttribute('data-drop-status'));
        }
      });
    }

    async function handleAction_(action, element) {
      try {
        if (action === 'refresh-route') {
          await loadRoute(true);
          showToast_('Refreshed the current view.', 'success');
          return;
        }

        if (action === 'open-help-modal') {
          openModal_(
            [
              '<div class="pointer-events-auto mx-auto max-w-lg w-full mt-16 bg-surface-container-lowest rounded-xl ambient-shadow p-7 space-y-4">',
              '<div class="flex items-start justify-between gap-4">',
              '<div class="space-y-1"><h2 class="font-headline text-2xl font-bold tracking-tight">Help Center</h2><p class="text-on-surface-variant">A quick orientation for the lightweight Roundtable workspace.</p></div>',
              '<button type="button" data-action="close-modal" class="text-outline hover:text-on-surface"><span class="material-symbols-outlined">close</span></button>',
              '</div>',
              '<div class="space-y-3 text-sm text-on-surface-variant">',
              '<p>Use <strong>New Spark</strong> to capture ideas, then launch a brainstorm from the idea detail page or the Brainstorming route.</p>',
              '<p>The right drawer gives you a quick edit surface for ideas, tasks, and resources without leaving the current view.</p>',
              '<p>Settings stores your API credentials in Script Properties and lets you install the daily reminder triggers.</p>',
              '</div>',
              '</div>',
            ].join('')
          );
          return;
        }

        if (action === 'toggle-mobile-nav') {
          openModal_(renderMobileNavModal_());
          return;
        }

        if (action === 'close-modal') {
          closeModal_();
          return;
        }

        if (action === 'close-drawer') {
          closeDrawer_();
          return;
        }

        if (action === 'clear-persona-avatar') {
          handlePersonaAvatarClear_(element);
          return;
        }

        if (action === 'open-resource-modal') {
          await ensureIdeas_(false);
          openModal_(renderResourceCreateModal_());
          return;
        }

        if (action === 'open-task-modal') {
          await Promise.all([ensureIdeas_(false), ensureTasks_(false)]);
          openModal_(
            renderTaskCreateModal_(
              element.getAttribute('data-default-status') || 'Todo',
              element.getAttribute('data-default-idea-id') || ''
            )
          );
          return;
        }

        if (action === 'toggle-idea-edit') {
          App.state.ui.ideaDetailEditing = !App.state.ui.ideaDetailEditing;
          await loadRoute(false);
          return;
        }

        if (action === 'launch-brainstorm-from-detail') {
          var currentRoute = parseHash_(window.location.hash);
          window.location.hash = '#brainstorm?ideaId=' + encodeURIComponent(currentRoute.params.id);
          return;
        }

        if (action === 'run-brainstorm') {
          window.location.hash = '#brainstorm?ideaId=' + encodeURIComponent(element.getAttribute('data-idea-id'));
          return;
        }

        if (action === 'open-idea-drawer') {
          await openIdeaDrawer_(element.getAttribute('data-idea-id'));
          return;
        }

        if (action === 'open-resource-drawer') {
          await openResourceDrawer_(element.getAttribute('data-resource-id'));
          return;
        }

        if (action === 'open-task-drawer') {
          await openTaskDrawer_(element.getAttribute('data-task-id'));
          return;
        }

        if (action === 'archive-idea') {
          await confirmIdeaArchive_(element.getAttribute('data-idea-id'));
          return;
        }

        if (action === 'confirm-archive-idea') {
          await AppApi.archiveIdea(element.getAttribute('data-idea-id'));
          invalidate(['ideas', 'dashboard']);
          closeModal_();
          await loadRoute(true);
          showToast_('Idea moved to Archived.', 'success');
          return;
        }

        if (action === 'test-llm-connection') {
          await testConnection_();
          return;
        }

        if (action === 'clear-sessions') {
          openModal_(renderConfirmModal_('Clear all sessions?', 'This will wipe every brainstorm turn from the Sessions sheet.', 'confirm-clear-sessions', 'Clear sessions'));
          return;
        }

        if (action === 'confirm-clear-sessions') {
          await AppApi.clearAllSessions();
          invalidate(['sessionHistory', 'dashboard']);
          closeModal_();
          await loadRoute(true);
          showToast_('All sessions were cleared.', 'success');
          return;
        }

        if (action === 'reset-scores') {
          openModal_(renderConfirmModal_('Reset all scores?', 'This clears PriorityScore and NextAction values across the idea bank.', 'confirm-reset-scores', 'Reset scores'));
          return;
        }

        if (action === 'confirm-reset-scores') {
          await AppApi.resetScores();
          invalidate(['ideas', 'dashboard']);
          closeModal_();
          await loadRoute(true);
          showToast_('Priority scores were reset.', 'success');
          return;
        }

        if (action === 'install-triggers') {
          await AppApi.installTriggers();
          showToast_('Daily reminder triggers installed.', 'success');
          return;
        }

        if (action === 'draft-idea-brief') {
          await handleIdeaDraftRequest_(element.closest('form'));
          return;
        }

        if (action === 'expand-idea-brief') {
          await handleIdeaBriefExpansionRequest_(element.closest('form'));
          return;
        }

        if (action === 'clear-idea-brief-draft') {
          clearIdeaDraftForm_(element.closest('form'));
          return;
        }

        if (action === 'pause-session-autoplay') {
          if (App.state.activeSession) {
            App.state.activeSession.autoplay = false;
            clearSessionAutoplayTimer_();
            renderBrainstormRoute_(App.state.route || parseHash_(window.location.hash), false);
            showToast_('Autoplay paused. You can resume when you are ready.', 'success');
          }
          return;
        }

        if (action === 'resume-session-autoplay') {
          if (App.state.activeSession) {
            App.state.activeSession.autoplay = true;
            renderBrainstormRoute_(App.state.route || parseHash_(window.location.hash), false);
            showToast_('Autoplay resumed.', 'success');
          }
          return;
        }

        if (action === 'run-next-persona-turn') {
          if (App.state.activeSession) {
            App.state.activeSession.autoplay = false;
          }
          clearSessionAutoplayTimer_();
          if (isActiveSessionTyping_()) {
            return;
          }
          await runNextSessionTurn_();
          return;
        }

        if (action === 'accept-recommendation') {
          clearLiveBrainstormEffects_();
          if (App.state.activeSession && App.state.activeSession.ideaId) {
            window.location.hash = '#ideas/' + encodeURIComponent(App.state.activeSession.ideaId);
          }
          App.state.activeSession = null;
          showToast_('Recommendation accepted. Review the updated idea record next.', 'success');
          return;
        }

        if (action === 'save-close-session') {
          clearLiveBrainstormEffects_();
          if (App.state.activeSession && App.state.activeSession.ideaId) {
            window.location.hash = '#ideas/' + encodeURIComponent(App.state.activeSession.ideaId);
          } else {
            window.location.hash = '#brainstorm/history';
          }
          App.state.activeSession = null;
          return;
        }

        if (action === 'run-session-again') {
          if (!App.state.activeSession) {
            return;
          }
          clearLiveBrainstormEffects_();
          var ideaId = App.state.activeSession.ideaId;
          var mode = App.state.activeSession.mode;
          App.state.activeSession = null;
          await startSession_(ideaId, mode);
          return;
        }

        if (action === 'resume-session') {
          clearLiveBrainstormEffects_();
          window.location.hash = '#brainstorm?sessionId=' + encodeURIComponent(element.getAttribute('data-session-id'));
          return;
        }

        if (action === 'confirm-delete-task') {
          await AppApi.deleteTask(element.getAttribute('data-task-id'));
          invalidate(['tasks', 'dashboard']);
          closeDrawer_();
          closeModal_();
          await loadRoute(true);
          showToast_('Task deleted.', 'success');
          return;
        }

        if (action === 'delete-task') {
          openModal_(renderConfirmModal_('Delete task?', 'This removes the task from the Tasks sheet.', 'confirm-delete-task', 'Delete task', element.getAttribute('data-task-id')));
        }
      } catch (error) {
        showToast_(error.message || 'Action failed.', 'error');
      }
    }

    function renderShell_() {
      var route = App.state.route || parseHash_(window.location.hash || '#dashboard');
      var settings = App.state.settings || { userName: 'Alex', avatarColor: 'primary' };
      document.getElementById('sidebar').innerHTML = renderSidebar_(route, settings);
      document.getElementById('desktop-topbar').innerHTML = renderTopbar_(settings, false);

    function renderIdeas_() {

      kanbanView.classList.toggle('hidden', App.state.ui.ideasView !== 'kanban');

      listView.innerHTML = IDEA_STAGES.map(function (stage) {
        var stageIdeas = ideas
          .filter(function (idea) {
            return idea.Stage === stage;
          })
          .sort(sortIdeasComparator_());
        return [
          '<section class="space-y-4">',
          '<div class="flex items-center justify-between">',
          '<div class="flex items-center gap-3"><h2 class="font-headline text-2xl font-bold tracking-tight">',

          '</div>',

            : '<div class="editorial-card p-5 text-sm text-on-surface-variant">No ideas are sitting in ' + escapeHtml_(stage) + ' right now.</div>',
          '</section>',
        ].join('');
      }).join('');

      kanbanView.innerHTML =
        '<div class="flex gap-5 min-w-max pb-4">' +
        IDEA_STAGES.map(function (stage) {
          var stageIdeas = ideas.filter(function (idea) {
            return idea.Stage === stage;
          });
          return [
            '<section class="w-80 shrink-0 bg-surface-container-low rounded-xl p-4 space-y-4" data-drop-type="idea" data-drop-stage="',
            escapeHtml_(stage),
            '">',
            '<div class="flex items-center justify-between"><div class="flex items-center gap-2"><h2 class="font-headline text-sm uppercase tracking-[0.12em] text-on-surface-variant">',
            escapeHtml_(stage),
            '</h2><span class="text-xs text-outline">',
            String(stageIdeas.length),

            '<div class="space-y-3 min-h-[280px]">',
            stageIdeas.length
              ? stageIdeas
                  .sort(sortIdeasComparator_())
                  .map(function (idea) {
                    return renderKanbanIdeaCard_(idea);
                  })
                  .join('')
              : '<div class="bg-surface-container-lowest rounded-lg p-4 text-sm text-on-surface-variant">Drop an idea here.</div>',
            '</div>',
            '</section>',
          ].join('');
        }).join('') +
        '</div>';

    async function renderBrainstormRoute_(route, force) {
      renderTemplateIntoOutlet_('template-brainstorm');
      var root = document.getElementById('route-outlet');
      var launcher = root.querySelector('[data-brainstorm-launcher]');
      var sessionContainer = root.querySelector('[data-brainstorm-session]');
      var historyContainer = root.querySelector('[data-brainstorm-history]');

      launcher.classList.remove('hidden');
      sessionContainer.classList.add('hidden');
      historyContainer.classList.add('hidden');

      if (route.query.ideaId) {
        App.state.ui.brainstormIdeaId = route.query.ideaId;
      }

      if (
        route.query.sessionId &&
        (!App.state.activeSession || App.state.activeSession.sessionId !== route.query.sessionId || force)
      ) {
        var progress = await AppApi.getSessionProgress(route.query.sessionId);
        App.state.activeSession = hydrateActiveSessionFromProgress_(progress);
      }

      if (App.state.activeSession && (!route.query.sessionId || App.state.activeSession.sessionId === route.query.sessionId)) {
        launcher.classList.add('hidden');
        sessionContainer.classList.remove('hidden');
        sessionContainer.innerHTML = renderBrainstormSession_(App.state.activeSession);
        scheduleSessionAutoplay_(App.state.activeSession.turns && App.state.activeSession.turns.length ? App.state.brainstormAutoDelayMs : 350);
        return;
      }

      clearSessionAutoplayTimer_();

      root.querySelector('[data-brainstorm-idea-select]').innerHTML = (App.state.ideas || [])
        .map(function (idea) {
          return '<option value="' + escapeHtml_(idea.ID) + '">' + escapeHtml_(idea.Name) + ' • ' + escapeHtml_(idea.Stage) + '</option>';
        })
        .join('');

      if (App.state.ui.brainstormIdeaId) {
        root.querySelector('[data-brainstorm-idea-select]').value = App.state.ui.brainstormIdeaId;
      }

      root.querySelector('[data-brainstorm-mode-grid]').innerHTML = Object.keys(BRAINSTORM_MODES)
        .map(function (mode) {
          var config = BRAINSTORM_MODES[mode];
          var active = App.state.ui.brainstormMode === mode;
          return [
            '<button type="button" data-brainstorm-mode="',
            escapeHtml_(mode),
            '" class="text-left rounded-xl p-5 transition-all duration-200 ease-in-out ',

            '">',
            '<div class="font-headline text-xl font-bold tracking-tight">',

            '</div>',
            '<p class="mt-2 text-sm ',

            escapeHtml_(config.description),
            '</p>',
            '<div class="mt-4 flex flex-wrap gap-2">',

            '</button>',

      root.querySelector('[data-brainstorm-launcher-recent]').innerHTML = (App.state.sessionHistory || []).length
        ? App.state.sessionHistory.slice(0, 4).map(renderDashboardSessionCard_).join('')

    async function startSession_(ideaId, mode) {
      clearLiveBrainstormEffects_();
      var session = await AppApi.createSession(ideaId, mode);
      App.state.activeSession = {
        sessionId: session.sessionId,
        ideaId: session.ideaId,
        ideaName: session.ideaName,
        mode: session.mode,
        personas: session.personas || (BRAINSTORM_MODES[session.mode] ? BRAINSTORM_MODES[session.mode].personas.map(function (key) {
          return { key: key };
        }) : []),
        turns: [],
        nextTurnIndex: 0,
        complete: false,
        synthesis: null,
        synthesisData: null,
        loading: false,
        autoplay: true,
      };
      window.location.hash = '#brainstorm?sessionId=' + encodeURIComponent(session.sessionId);
      await loadRoute(false);
    }

    async function runNextSessionTurn_() {
      var session = App.state.activeSession;
      if (!session || session.loading || session.complete || isActiveSessionTyping_()) {
        clearSessionAutoplayTimer_();
        return;
      }
      clearSessionAutoplayTimer_();
      session.loading = true;
      renderBrainstormRoute_(App.state.route || parseHash_(window.location.hash), false);

      try {
        var previousTurnCount = (session.turns || []).filter(function (turn) {
          return turn.Agent !== 'Synthesis';
        }).length;
        var progress = await AppApi.runNextBrainstormTurn(
          session.sessionId,
          session.ideaId,
          session.mode,
          session.nextTurnIndex
        );
        var autoplay = session.autoplay !== false;
        App.state.activeSession = hydrateActiveSessionFromProgress_(progress, session.mode);
        App.state.activeSession.autoplay = autoplay && !App.state.activeSession.complete;
        invalidate(['sessionHistory', 'dashboard', 'ideas']);
        await ensureSessionHistory_(true);
        await ensureDashboard_(true);
        await ensureIdeas_(true);
        renderBrainstormRoute_(App.state.route || parseHash_(window.location.hash), false);
        if (App.state.activeSession) {
          var latestTurn = getLatestSpokenTurn_(App.state.activeSession);
          var currentTurnCount = (App.state.activeSession.turns || []).filter(function (turn) {
            return turn.Agent !== 'Synthesis';
          }).length;
          if (latestTurn && currentTurnCount > previousTurnCount) {
            beginTurnTypewriter_(App.state.activeSession, latestTurn);
          } else if (App.state.activeSession.complete) {
            showToast_('Roundtable session complete. Synthesis is ready.', 'success');
          }
        }
      } catch (error) {
        session.loading = false;
        session.autoplay = false;
        App.state.activeSession = session;
        renderBrainstormRoute_(App.state.route || parseHash_(window.location.hash), false);
        showToast_(error.message || 'Failed to progress the brainstorm session.', 'error');
      }
    }

    async function testConnection_() {
      var root = document.getElementById('route-outlet');
      var form = root.querySelector('#settings-form');
      var status = root.querySelector('[data-settings-api-status]');
      var payload = form ? formToObject_(form) : {};
      var provider = normalizeClientProviderName_(payload.activeLlmProvider || (App.state.settings || {}).activeLlmProvider);
      var providerLabel = getClientProviderLabel_(provider);
      if (status) {
        status.textContent = 'Testing ' + providerLabel + '...';
      }
      try {
        var result = await AppApi.testLLMConnection(payload);
        if (status) {
          status.textContent = result.ok
            ? getClientProviderLabel_(result.provider) + ' responded using ' + result.model + '.'
            : 'Test failed: ' + result.error;
        }
        showToast_(
          result.ok ? getClientProviderLabel_(result.provider) + ' connection succeeded.' : 'Connection test failed.',
          result.ok ? 'success' : 'error'
        );
      } catch (error) {
        if (status) {
          status.textContent = error.message || 'Connection test failed.';
        }
        showToast_(error.message || 'Connection test failed.', 'error');
      }
    }

    function syncSettingsProviderUi_(form, settings) {
      if (!(form instanceof HTMLFormElement)) {
        return;
      }

      var provider = normalizeClientProviderName_(
        (form.querySelector('[name="activeLlmProvider"]') || {}).value || settings.activeLlmProvider
      );
      var status = document.querySelector('[data-settings-api-status]');
      var keyStateMap = {
        deepseek: !!settings.hasDeepSeekApiKey,
        gemini: !!settings.hasGeminiApiKey,
        openrouter: !!settings.hasOpenRouterApiKey,
        openai: !!settings.hasOpenAiApiKey,
        anthropic: !!settings.hasAnthropicApiKey,
      };

      Array.prototype.forEach.call(form.querySelectorAll('[data-provider-card]'), function (card) {
        var cardProvider = normalizeClientProviderName_(card.getAttribute('data-provider-card'));
        card.className =
          'rounded-xl p-5 ghost-border space-y-4 transition-all duration-200 ease-in-out ' +
          (cardProvider === provider
            ? 'bg-surface-container-lowest ambient-shadow ring-1 ring-primary/20'
            : 'bg-surface-container-low');
      });

      Array.prototype.forEach.call(form.querySelectorAll('[data-provider-key-status]'), function (node) {
        var cardProvider = normalizeClientProviderName_(node.getAttribute('data-provider-key-status'));
        var providerLabel = getClientProviderLabel_(cardProvider);
        var hasStoredKey = keyStateMap[cardProvider];
        node.textContent = hasStoredKey
          ? providerLabel + ' already has a stored server key. Leave the field blank to keep it.'
          : 'No stored ' + providerLabel + ' key yet.';
      });

      if (status) {
        status.textContent = keyStateMap[provider]
          ? getClientProviderLabel_(provider) + ' is ready for a live connection test.'
          : getClientProviderLabel_(provider) + ' still needs an API key before live calls will work.';

    async function compressPersonaAvatarFile_(file) {
      if (!file || String(file.type || '').indexOf('image/') !== 0) {
        throw new Error('Choose an image file for the persona portrait.');
      }
      var sourceDataUrl = await readFileAsDataUrl_(file);
      var image = await loadImageElement_(sourceDataUrl);
      var longestEdge = Math.max(image.naturalWidth || image.width || 0, image.naturalHeight || image.height || 0) || 1;
      var scale = Math.min(1, 256 / longestEdge);
      var width = Math.max(96, Math.round((image.naturalWidth || image.width || 256) * scale));
      var height = Math.max(96, Math.round((image.naturalHeight || image.height || 256) * scale));
      var canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      var context = canvas.getContext('2d');
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = 'high';
      context.drawImage(image, 0, 0, width, height);
      var output = canvas.toDataURL('image/jpeg', 0.86);
      if (output.length > 260000) {
        output = canvas.toDataURL('image/jpeg', 0.72);
      }
      return output;
    }

    function readFileAsDataUrl_(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onload = function () {
          resolve(String(reader.result || ''));
        };
        reader.onerror = function () {
          reject(new Error('The selected image could not be read.'));
        };
        reader.readAsDataURL(file);
      });
    }

    function loadImageElement_(dataUrl) {
      return new Promise(function (resolve, reject) {
        var image = new Image();
        image.onload = function () {
          resolve(image);
        };
        image.onerror = function () {
          reject(new Error('The selected image could not be prepared for preview.'));
        };
        image.src = dataUrl;
      });
    }

    function normalizeClientProviderName_(provider) {
      var normalized = String(provider || '')
        .toLowerCase()
        .replace(/[^a-z]/g, '');
      if (normalized === 'openrouter') {
        return 'openrouter';
      }
      if (normalized === 'deepseek') {
        return 'deepseek';
      }
      if (normalized === 'openai') {
        return 'openai';
      }
      if (normalized === 'anthropic') {
        return 'anthropic';
      }
      if (normalized === 'gemini' || normalized === 'google') {
        return 'gemini';
      }
      return 'gemini';
    }

    function getClientProviderLabel_(provider) {
      provider = normalizeClientProviderName_(provider);
      return SETTINGS_PROVIDER_META[provider] ? SETTINGS_PROVIDER_META[provider].label : 'Provider';
    }

            : '<div class="flex justify-end"><button type="button" data-action="pause-session-autoplay" class="px-4 py-3 rounded-lg ghost-border text-primary font-medium">Pause Autoplay</button></div>',
        '</div>',
        '<aside class="space-y-6">',
        '<div class="editorial-card p-6 space-y-4">',
        '<div><h2 class="font-headline text-2xl font-bold tracking-tight">Session Synthesis</h2><p class="text-on-surface-variant text-sm">Real-time thematic extraction</p></div>',
        synthesis.summary
          ? '<div class="bg-surface-container-low rounded-lg p-4 space-y-4"><div><div class="text-xs uppercase tracking-[0.12em] text-primary font-medium">Leading concept</div><div class="font-headline text-xl font-bold tracking-tight mt-2">' + escapeHtml_(synthesis.summary) + '</div></div><div class="text-sm text-on-surface-variant"><strong class="text-on-surface">Next action:</strong> ' + escapeHtml_(synthesis.nextAction || 'Waiting for synthesis...') + '</div><div class="text-sm text-on-surface-variant"><strong class="text-on-surface">Suggested stage:</strong> ' + escapeHtml_(synthesis.suggestedStage || idea.Stage) + '</div></div>'
          : '<div class="bg-surface-container-low rounded-lg p-4 text-sm text-on-surface-variant">A synthesis will appear automatically after the final persona turn.</div>',
        '</div>',
        '<div class="editorial-card p-6 space-y-4">',
        '<div class="text-xs uppercase tracking-[0.12em] text-on-surface-variant">Voices in room</div>',
        '<div class="space-y-3">',
        voices.map(function (persona, index) {
          var meta = getPersonaVisual_(persona);
          var heard = session.complete || index < session.nextTurnIndex;
          var next = !session.complete && persona === nextPersona;
          return '<div class="flex items-center gap-3 rounded-lg px-3 py-2 ' + (next ? 'bg-surface-container-low' : 'bg-transparent') + '">' + renderPersonaAvatarBadge_(persona, 'w-9 h-9 text-xs', next && autoplayLive ? 'avatar-pulse' : '') + '<div class="min-w-0 flex-1"><div class="font-medium text-on-surface">' + escapeHtml_(meta.label) + '</div><div class="text-xs text-on-surface-variant">' + escapeHtml_(meta.role) + '</div></div><div class="text-[10px] uppercase tracking-[0.12em] ' + (next ? 'text-primary' : heard ? 'text-secondary' : 'text-on-surface-variant') + '">' + (next ? 'Up next' : heard ? 'Heard' : 'Queued') + '</div></div>';
        }).join(''),
        '</div>',
        '</div>',
        '<div class="editorial-card p-6 space-y-3"><div class="text-xs uppercase tracking-[0.12em] text-on-surface-variant">Automation</div><div class="font-headline text-2xl font-bold tracking-tight">' + (session.complete ? 'Autoplay finished the full round.' : autoplayLive ? 'Autoplay is carrying the session.' : 'Manual hold is active.') + '</div><p class="text-sm text-on-surface-variant">' + (session.complete ? 'The roundtable completed without manual stepping.' : autoplayLive ? 'Responses animate letter by letter, then the next persona begins automatically.' : 'The current response will finish animating, and the next persona will wait for you.') + '</p></div>',
        '</aside>',
        '</div>',
      ].join('');
    }

    function renderBrainstormPresenceCard_(session, voices, nextPersona) {
      return [
        '<article class="editorial-card p-5 space-y-4">',
        '<div class="space-y-1"><div class="text-xs uppercase tracking-[0.12em] text-on-surface-variant font-medium">Voices In Room</div><h2 class="font-headline text-2xl font-bold tracking-tight">Who is speaking</h2></div>',
        voices
          .map(function (persona, index) {
            var meta = PERSONA_META[persona] || PERSONA_META.Kai;
            var completed = session.complete || index < session.nextTurnIndex;
            var active = !session.complete && persona === nextPersona;
            return [
              '<div class="persona-chip-live ',
              active ? 'active' : '',
              ' rounded-xl p-4 ',
              active ? 'bg-surface-container-lowest ambient-shadow' : 'bg-surface-container-low',
              '">',
              '<div class="flex items-center gap-3">',
              '<div class="w-10 h-10 rounded-full ',
              meta.pill,
              ' flex items-center justify-center font-headline font-bold text-sm ',
              active ? 'avatar-pulse' : '',
              '">',
              escapeHtml_(meta.initial),
              '</div>',
              '<div class="min-w-0 flex-1">',
              '<div class="flex items-center justify-between gap-3">',
              '<div class="font-headline text-lg font-bold tracking-tight">',
              escapeHtml_(persona),
              '</div>',
              '<div class="text-[10px] uppercase tracking-[0.12em] ',
              active ? 'text-primary' : completed ? 'text-secondary' : 'text-on-surface-variant',
              '">',
              active ? 'Up Next' : completed ? 'Heard' : 'Queued',
              '</div>',
              '</div>',
              '<div class="text-sm text-on-surface-variant">',
              escapeHtml_(meta.role),
              '</div>',
              '</div>',
              '</div>',
              '</div>',
            ].join('');
          })
          .join(''),
        '</article>',
      ].join('');
    }

    function renderBrainstormSignalStack_(session, synthesis) {
      var signals = buildBrainstormSignalData_(session, synthesis);
      return [
        renderBrainstormSignalCard_('Momentum', signals.momentum, 'How much of the room has weighed in so far.'),
        renderBrainstormSignalCard_('Opportunity', signals.opportunity, 'Positive signal density across the conversation.'),
        renderBrainstormSignalCard_('Risk Pressure', signals.risk, 'Critical friction and assumption heat picked up by the board.'),
        renderBrainstormSignalCard_('Actionability', signals.actionability, 'How concrete the next move has become.'),
      ].join('');
    }

    function renderBrainstormSignalCard_(label, value, body) {
      return [
        '<article class="editorial-card p-5 space-y-4">',
        '<div class="flex items-end justify-between gap-4">',
        '<div><div class="text-xs uppercase tracking-[0.12em] text-on-surface-variant font-medium">',
        escapeHtml_(label),
        '</div><div class="font-headline text-4xl font-extrabold tracking-tight">',
        escapeHtml_(String(Math.round(value))),
        '%</div></div>',
        '<span class="material-symbols-outlined text-on-surface-variant">monitoring</span>',
        '</div>',
        '<div class="signal-bar"><span style="width:',
        escapeHtml_(String(Math.max(6, Math.round(value)))),
        '%"></span></div>',
        '<p class="text-sm text-on-surface-variant">',
        escapeHtml_(body),
        '</p>',
        '</article>',
      ].join('');
    }

    function renderBrainstormWhiteboardNotes_(session, synthesis, idea) {
      var lastVoice = (session.turns || [])
        .filter(function (turn) {
          return turn.Agent !== 'Synthesis';
        })
        .slice(-1)[0];
      var criticTurn = findSessionTurnByAgent_(session, 'Sage');
      var userTurn = findSessionTurnByAgent_(session, 'Luna');
      return [
        renderBrainstormStickyNote_(
          'Problem Frame',
          idea.ProblemSolved || idea.Summary || 'The brief is still being translated into a sharper problem statement.',
          'bg-surface-container-lowest'
        ),
        renderBrainstormStickyNote_(
          lastVoice ? lastVoice.Agent + ' just pushed this angle' : 'The session is opening',
          lastVoice ? truncateText_(lastVoice.Content, 180) : 'The first perspective will appear here as soon as the session begins.',
          'bg-primary-container'
        ),
        renderBrainstormStickyNote_(
          'User Tension',
          userTurn ? truncateText_(userTurn.Content, 170) : 'Luna will map the emotional and usability tension once her turn lands.',
          'bg-secondary-container'
        ),
        renderBrainstormStickyNote_(
          'Critical Watchout',
          criticTurn ? truncateText_(criticTurn.Content, 170) : 'Sage has not raised the strongest challenge yet.',
          'bg-tertiary-container'
        ),
        renderBrainstormStickyNote_(
          'Emerging Next Move',
          synthesis.nextAction || idea.NextAction || 'A concrete next move will lock in once the synthesis finishes.',
          'bg-surface-container-lowest'
        ),
      ].join('');
    }

    function renderBrainstormStickyNote_(title, body, backgroundClass) {
      return [
        '<article class="brainstorm-note rounded-xl p-4 space-y-3 ',
        backgroundClass || 'bg-surface-container-lowest',
        '">',
        '<div class="text-xs uppercase tracking-[0.12em] text-on-surface-variant font-medium">',
        escapeHtml_(title),
        '</div>',
        '<div class="text-sm leading-relaxed text-on-surface">',
        escapeHtml_(body),
        '</div>',
        '</article>',
      ].join('');
    }

    function renderBrainstormSynthesisCard_(session, synthesis, idea) {
      return [
        '<article class="editorial-card p-6 space-y-4">',
        '<div class="space-y-1"><div class="text-xs uppercase tracking-[0.12em] text-on-surface-variant font-medium">Session Synthesis</div><h2 class="font-headline text-2xl font-bold tracking-tight">What the board is converging on</h2></div>',
        synthesis.summary
          ? '<div class="bg-surface-container-low rounded-xl p-4 space-y-4"><div class="font-headline text-xl font-bold tracking-tight">' +
            escapeHtml_(synthesis.summary) +
            '</div><div class="text-sm text-on-surface-variant"><strong class="text-on-surface">Next action:</strong> ' +
            escapeHtml_(synthesis.nextAction || 'Waiting for synthesis...') +
            '</div><div class="text-sm text-on-surface-variant"><strong class="text-on-surface">Suggested stage:</strong> ' +
            escapeHtml_(synthesis.suggestedStage || idea.Stage) +
            '</div></div>'
          : '<div class="bg-surface-container-low rounded-xl p-4 text-sm text-on-surface-variant">The synthesis card will populate automatically once the final voice is heard.</div>',
        synthesis.keyInsights && synthesis.keyInsights.length
          ? '<div class="space-y-2">' +
            synthesis.keyInsights
              .map(function (insight) {
                return '<div class="rounded-lg bg-surface-container-highest px-3 py-2 text-sm text-on-surface-variant">' + escapeHtml_(insight) + '</div>';
              })
              .join('') +
            '</div>'
          : '',
        '</article>',
      ].join('');
    }

    function renderBrainstormVoiceChart_(session) {
      var turns = (session.turns || []).filter(function (turn) {
        return turn.Agent !== 'Synthesis';
      });
      return [
        '<article class="editorial-card p-6 space-y-4">',
        '<div class="space-y-1"><div class="text-xs uppercase tracking-[0.12em] text-on-surface-variant font-medium">Board Activity</div><h2 class="font-headline text-2xl font-bold tracking-tight">Voice intensity graph</h2></div>',
        turns.length
          ? turns
              .map(function (turn) {
                var meta = PERSONA_META[turn.Agent] || PERSONA_META.Kai;
                var width = clampNumber_(Math.round((String(turn.Content || '').length / 220) * 100), 16, 100);
                return [
                  '<div class="space-y-2">',
                  '<div class="flex items-center justify-between gap-3 text-sm"><span class="inline-flex items-center gap-2"><span class="w-7 h-7 rounded-full ',
                  meta.pill,
                  ' flex items-center justify-center font-headline font-bold text-[11px]">',
                  escapeHtml_(meta.initial),
                  '</span>',
                  escapeHtml_(turn.Agent),
                  '</span><span class="text-on-surface-variant">',
                  escapeHtml_(formatDateTime_(turn.Timestamp, true)),
                  '</span></div>',
                  '<div class="signal-bar"><span style="width:',
                  escapeHtml_(String(width)),
                  '%"></span></div>',
                  '</div>',
                ].join('');
              })
              .join('')
          : '<div class="text-sm text-on-surface-variant">The graph will build once the first persona responds.</div>',
        '</article>',
      ].join('');
    }

    function renderBrainstormControlsCard_(session) {
      return [
        '<article class="editorial-card p-6 space-y-4">',
        '<div class="space-y-1"><div class="text-xs uppercase tracking-[0.12em] text-on-surface-variant font-medium">Controls</div><h2 class="font-headline text-2xl font-bold tracking-tight">Session flow</h2></div>',
        '<p class="text-sm text-on-surface-variant">',
        session.complete
          ? 'The conversation has finished. You can accept the recommendation, close the session, or run a new round.'
          : session.autoplay === false
            ? 'Autoplay is paused. Resume the live flow or advance one voice manually.'
            : 'Autoplay is active. The Roundtable will keep moving through each voice automatically.',
        '</p>',
        session.complete
          ? '<div class="flex flex-col gap-3"><button type="button" data-action="accept-recommendation" class="w-full px-4 py-3 rounded-lg bg-gradient-primary text-on-primary font-medium">Accept Recommendation</button><button type="button" data-action="save-close-session" class="w-full px-4 py-3 rounded-lg ghost-border text-primary font-medium">Save & Close</button><button type="button" data-action="run-session-again" class="w-full px-4 py-3 rounded-lg bg-surface-container-highest text-on-surface font-medium">Run Again</button></div>'
          : session.autoplay === false
            ? '<div class="flex flex-col gap-3"><button type="button" data-action="resume-session-autoplay" class="w-full px-4 py-3 rounded-lg bg-gradient-primary text-on-primary font-medium">Resume Live Session</button><button type="button" data-action="run-next-persona-turn" class="w-full px-4 py-3 rounded-lg bg-surface-container-highest text-on-surface font-medium">' +
              (session.loading ? 'Working...' : 'Advance One Voice') +
              '</button></div>'
            : '<div class="flex flex-col gap-3"><button type="button" data-action="pause-session-autoplay" class="w-full px-4 py-3 rounded-lg ghost-border text-primary font-medium">Pause Autoplay</button><button type="button" data-action="save-close-session" class="w-full px-4 py-3 rounded-lg bg-surface-container-highest text-on-surface font-medium">Save & Close</button></div>',
        '</article>',
      ].join('');
    }

    function buildBrainstormSignalData_(session, synthesis) {
      var transcript = (session.turns || [])
        .filter(function (turn) {
          return turn.Agent !== 'Synthesis';
        })
        .map(function (turn) {
          return String(turn.Content || '');
        })
        .join(' ')
        .toLowerCase();
      var totalVoices = Math.max(detectBrainstormPersonas_(session.personas).length, 1);
      var heardVoices = (session.turns || []).filter(function (turn) {
        return turn.Agent !== 'Synthesis';
      }).length;
      return {
        momentum: clampNumber_(Math.round((heardVoices / totalVoices) * 100), 0, 100),
        opportunity: clampNumber_(
          28 + countKeywordHits_(transcript, ['opportunity', 'advantage', 'valuable', 'growth', 'demand', 'differentiator', 'expand']) * 11,
          0,
          100
        ),
        risk: clampNumber_(
          20 + countKeywordHits_(transcript, ['risk', 'assumption', 'unclear', 'competition', 'hard', 'difficult', 'expensive', 'fragile']) * 12,
          0,
          100
        ),
        actionability: clampNumber_(
          24 +
            countKeywordHits_(transcript, ['prototype', 'test', 'validate', 'ship', 'launch', 'experiment', 'mvp', 'next action']) * 10 +
            (synthesis && synthesis.nextAction ? 12 : 0),
          0,
          100
        ),
      };
    }

    function findSessionTurnByAgent_(session, agent) {
      return (session.turns || []).find(function (turn) {
        return turn.Agent === agent;
      });
    }

    function renderTaskFilters_() {
      var ideas = App.state.ideas || [];
      var filterButtons = [
        '<button type="button" data-task-idea-filter="All Ideas" class="px-3 py-1.5 rounded-full text-sm font-medium ' +
          (App.state.ui.taskIdeaFilter === 'All Ideas' ? 'bg-primary-container text-on-primary-container' : 'bg-surface-container-highest text-on-surface-variant') +
          '">All Ideas</button>',
      ];
      ideas.slice(0, 5).forEach(function (idea) {
        filterButtons.push(
          '<button type="button" data-task-idea-filter="' +
            escapeHtml_(idea.ID) +
            '" class="px-3 py-1.5 rounded-full text-sm font-medium ' +
            (App.state.ui.taskIdeaFilter === idea.ID ? 'bg-secondary-container text-on-secondary-container' : 'bg-surface-container-highest text-on-surface-variant') +
            '">' +
            escapeHtml_(idea.Name) +
            '</button>'
        );
      });
      filterButtons.push(
        '<button type="button" data-task-due-filter="' +
          escapeHtml_(App.state.ui.taskDueFilter === 'Overdue' ? 'All' : 'Overdue') +
          '" class="px-3 py-1.5 rounded-full text-sm font-medium ' +
          (App.state.ui.taskDueFilter === 'Overdue' ? 'bg-error-container text-on-error-container' : 'bg-surface-container-highest text-on-surface-variant') +
          '">' +
          escapeHtml_(App.state.ui.taskDueFilter === 'Overdue' ? 'Showing overdue only' : 'Due: Overdue') +
          '</button>'
      );
      return filterButtons.join('');
    }

    function renderTaskBoard_(tasks) {
      return (
        '<div class="flex gap-6 min-w-max pb-4">' +
        TASK_COLUMNS.map(function (status) {
          var columnTasks = tasks.filter(function (task) {
            return task.Status === status;
          });
          var tone = status === 'Blocked' ? 'text-error' : 'text-on-surface-variant';
          return [
            '<section class="w-80 shrink-0 space-y-4" data-drop-type="task" data-drop-status="',
            escapeHtml_(status),
            '">',
            '<div class="flex items-center justify-between">',
            '<div class="flex items-center gap-2"><h2 class="font-headline text-sm uppercase tracking-[0.12em] ',
            tone,
            '">',
            escapeHtml_(TASK_STATUS_LABELS[status]),
            '</h2><span class="text-xs text-outline">',
            String(columnTasks.length),
            '</span></div>',
            '<button type="button" data-action="open-task-modal" data-default-status="',
            escapeHtml_(status),
            '" class="text-outline hover:text-on-surface"><span class="material-symbols-outlined text-lg">add</span></button>',
            '</div>',
            '<div class="space-y-3 min-h-[320px] bg-surface-container-low rounded-xl p-4">',
            columnTasks.length
              ? columnTasks.map(renderTaskCard_).join('')
              : '<div class="bg-surface-container-lowest rounded-lg p-4 text-sm text-on-surface-variant">No tasks in ' + escapeHtml_(TASK_STATUS_LABELS[status]) + '.</div>',
            '</div>',
            '</section>',
          ].join('');
        }).join('') +
        '</div>'
      );
    }

    function renderIdeaCard_(idea, options) {
      options = options || {};
      var stageMeta = STAGE_META[idea.Stage] || STAGE_META.Spark;
      return [
        '<article class="editorial-card p-6 relative overflow-hidden">',
        '<div class="absolute left-0 top-0 bottom-0 w-1 ',
        stageMeta.accent,
        '"></div>',
        '<div class="flex flex-col lg:flex-row gap-4 lg:items-start justify-between">',
        '<div class="space-y-3 flex-1 min-w-0">',
        '<div class="flex flex-wrap items-center gap-2">',
        renderStageBadge_(idea.Stage),
        '<span class="text-xs text-outline inline-flex items-center gap-1"><span class="material-symbols-outlined text-sm">folder</span>',
        escapeHtml_(idea.Category || 'Other'),
        '</span>',
        '</div>',
        '<button type="button" data-nav="#ideas/',
        escapeHtml_(idea.ID),
        '" class="text-left font-headline text-2xl font-bold tracking-tight hover:text-primary transition-all duration-200 ease-in-out">',
        escapeHtml_(idea.Name),
        '</button>',
        '<p class="text-on-surface-variant leading-relaxed">',
        escapeHtml_(idea.Summary || 'No summary recorded yet.'),
        '</p>',
        '<div class="flex flex-wrap items-center gap-2">',
        splitList_(idea.Tags || '').slice(0, 4).map(renderTagChip_).join(''),
        '</div>',
        '<div class="text-sm text-on-surface-variant"><strong class="text-on-surface">Next Action:</strong> ',
        escapeHtml_(idea.NextAction || 'Not generated yet.'),
        '</div>',
        '</div>',
        '<div class="flex flex-col items-start lg:items-end gap-3 shrink-0">',
        '<div class="text-right"><div class="font-headline text-4xl font-extrabold text-primary">',
        scoreToPercent_(idea.PriorityScore || 0),
        '</div><div class="text-[10px] uppercase tracking-[0.12em] text-outline">Priority Score</div></div>',
        options.hideActions
          ? ''
          : '<div class="flex flex-wrap gap-2"><button type="button" data-action="run-brainstorm" data-idea-id="' +
            escapeHtml_(idea.ID) +
            '" class="px-3 py-2 rounded-lg bg-surface-container-highest text-on-surface text-sm font-medium hover:bg-surface-container-high transition-all duration-200 ease-in-out">Run Brainstorm</button><button type="button" data-action="open-idea-drawer" data-idea-id="' +
            escapeHtml_(idea.ID) +
            '" class="px-3 py-2 rounded-lg ghost-border text-primary text-sm font-medium hover:bg-surface-container-low transition-all duration-200 ease-in-out">Quick View</button><button type="button" data-action="archive-idea" data-idea-id="' +
            escapeHtml_(idea.ID) +
            '" class="px-3 py-2 rounded-lg ghost-border text-on-surface-variant text-sm font-medium hover:bg-surface-container-low transition-all duration-200 ease-in-out">Archive</button></div>',
        '</div>',
        '</div>',
        '</article>',
      ].join('');
    }

    function renderKanbanIdeaCard_(idea) {
      return [
        '<article draggable="true" data-drag-type="idea" data-drag-id="',
        escapeHtml_(idea.ID),
        '" class="editorial-card p-4 space-y-3 cursor-grab active:cursor-grabbing hover:-translate-y-1 transition-all duration-200 ease-in-out">',
        '<div class="flex items-center justify-between gap-3">',
        renderStageBadge_(idea.Stage),
        '<button type="button" data-action="open-idea-drawer" data-idea-id="',
        escapeHtml_(idea.ID),
        '" class="text-outline hover:text-on-surface"><span class="material-symbols-outlined text-lg">open_in_new</span></button>',
        '</div>',
        '<div class="font-headline text-xl font-bold tracking-tight">',
        escapeHtml_(idea.Name),
        '</div>',
        '<div class="text-sm text-on-surface-variant">',
        escapeHtml_(idea.Category || 'Other'),
        ' • ',
        scoreToPercent_(idea.PriorityScore || 0),
        '</div>',
        '<div class="flex flex-wrap gap-2">',
        splitList_(idea.Tags || '').slice(0, 3).map(renderTagChip_).join(''),
        '</div>',
        '</article>',
      ].join('');
    }

    function renderTaskCard_(task) {
      var statusAccent =
        task.Status === 'Blocked'
          ? 'border-l-2 border-error'
          : task.Status === 'InProgress'
          ? 'border-l-2 border-primary'
          : task.Status === 'Done'
          ? 'opacity-60'
          : '';
      return [
        '<article draggable="true" data-drag-type="task" data-drag-id="',
        escapeHtml_(task.TaskID),
        '" class="bg-surface-container-lowest rounded-xl p-4 ambient-shadow space-y-3 cursor-grab active:cursor-grabbing hover:-translate-y-1 transition-all duration-200 ease-in-out ',
        statusAccent,
        '">',
        '<div class="flex items-start justify-between gap-3">',
        '<button type="button" data-action="open-task-drawer" data-task-id="',
        escapeHtml_(task.TaskID),
        '" class="px-2 py-0.5 rounded text-[10px] uppercase tracking-[0.12em] font-medium ',
        (STAGE_META[task.IdeaStage] || STAGE_META.Spark).badge,
        '">',
        escapeHtml_(task.IdeaName || 'Unlinked'),
        '</button>',
        '<button type="button" data-action="open-task-drawer" data-task-id="',
        escapeHtml_(task.TaskID),
        '" class="text-outline hover:text-on-surface"><span class="material-symbols-outlined text-lg">more_horiz</span></button>',
        '</div>',
        '<button type="button" data-action="open-task-drawer" data-task-id="',
        escapeHtml_(task.TaskID),
        '" class="text-left w-full font-medium text-lg leading-snug hover:text-primary transition-all duration-200 ease-in-out ',
        task.Status === 'Done' ? 'line-through text-on-surface-variant' : '',
        '">',
        escapeHtml_(task.Title),
