    function renderPersonaPill_(persona) {
      var meta = getPersonaVisual_(persona);
      return '<span class="px-3 py-1 rounded-full text-xs font-medium uppercase tracking-[0.12em] bg-surface-container-highest text-on-surface inline-flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full ' + meta.line + '"></span>' + escapeHtml_(meta.label) + '</span>';
    }

    function renderStagePillsFromSession_(personas) {
      return '<span class="px-3 py-1 rounded-full bg-surface-container-highest text-sm text-on-surface-variant">' + escapeHtml_(detectModeFromPersonas_(personas)) + '</span>';
    }

    function renderTagChip_(tag) {
      return '<span class="px-2.5 py-1 rounded-lg bg-surface-container-highest text-xs text-on-surface-variant">' + escapeHtml_(tag) + '</span>';
    }

    function renderScoreMeter_(score) {
      return [
        '<div class="space-y-4">',
        '<div class="flex items-end gap-3"><div class="font-headline text-5xl font-extrabold text-secondary">',
        scoreToPercent_(score),
        '</div><div class="text-on-surface-variant text-sm uppercase tracking-[0.12em]">Priority</div></div>',
        '<div class="w-full h-3 bg-surface-container-highest rounded-full overflow-hidden"><div class="h-full bg-gradient-primary rounded-full" style="width:',
        String(Math.max(4, Math.round(Number(score || 0) * 100))),
        '%"></div></div>',
        '</div>',
      ].join('');
    }

    function renderStatCard_(label, value, icon) {
      return [
        '<article class="editorial-card p-5 flex items-center justify-between gap-4">',
        '<div class="space-y-2"><div class="text-xs uppercase tracking-[0.12em] text-on-surface-variant">',
        escapeHtml_(label),
        '</div><div class="font-headline text-4xl font-extrabold tracking-tight">',
        escapeHtml_(String(value)),
        '</div></div>',
        '<div class="w-11 h-11 rounded-xl bg-surface-container-highest text-on-surface-variant flex items-center justify-center"><span class="material-symbols-outlined">',
        escapeHtml_(icon),
        '</span></div>',
        '</article>',
      ].join('');
    }

    function renderEmptyState_(title, body, buttonLabel, navHash, action) {
      var buttonHtml = '';
      if (navHash) {
        buttonHtml = '<button type="button" data-nav="' + escapeHtml_(navHash) + '" class="px-4 py-2.5 rounded-lg bg-gradient-primary text-on-primary font-medium">' + escapeHtml_(buttonLabel) + '</button>';
      } else if (action) {
        buttonHtml = '<button type="button" data-action="' + escapeHtml_(action) + '" class="px-4 py-2.5 rounded-lg bg-gradient-primary text-on-primary font-medium">' + escapeHtml_(buttonLabel) + '</button>';
      }
      return [
        '<div class="space-y-4">',
        '<div class="w-14 h-14 mx-auto rounded-2xl bg-surface-container-highest text-on-surface-variant flex items-center justify-center"><span class="material-symbols-outlined text-2xl">wb_twilight</span></div>',
        '<div class="space-y-2"><div class="font-headline text-3xl font-bold tracking-tight">',
        escapeHtml_(title),
        '</div><p class="text-on-surface-variant max-w-2xl mx-auto">',
        escapeHtml_(body),
        '</p></div>',
        buttonHtml,
        '</div>',
      ].join('');
    }

    function renderInlineEmptyState_(title, body, buttonLabel, navHash) {
      return '<div class="editorial-card p-6 text-center space-y-3"><div class="font-headline text-2xl font-bold tracking-tight">' + escapeHtml_(title) + '</div><p class="text-on-surface-variant">' + escapeHtml_(body) + '</p><button type="button" data-nav="' + escapeHtml_(navHash) + '" class="px-4 py-2.5 rounded-lg bg-gradient-primary text-on-primary font-medium">' + escapeHtml_(buttonLabel) + '</button></div>';
    }

    function renderSmallEmptyCard_(title, body) {
      return '<article class="editorial-card p-5 space-y-2"><div class="font-headline text-xl font-bold tracking-tight">' + escapeHtml_(title) + '</div><div class="text-sm text-on-surface-variant">' + escapeHtml_(body) + '</div></article>';
    }

    function filterIdeas_(ideas) {
      return ideas
        .filter(function (idea) {
          if (App.state.ui.ideaStage !== 'All' && idea.Stage !== App.state.ui.ideaStage) {
            return false;
          }
          if (App.state.ui.ideasSearch) {
            var haystack = [idea.Name, idea.Summary, idea.Category, idea.Tags].join(' ').toLowerCase();
            if (haystack.indexOf(App.state.ui.ideasSearch.toLowerCase()) === -1) {
              return false;
            }
          }
          return true;
        })
        .slice()
        .sort(sortIdeasComparator_());
    }

    function sortIdeasComparator_() {
      return function (left, right) {
        var key = App.state.ui.ideasSort;
        if (key === 'Name') {
          return String(left.Name || '').localeCompare(String(right.Name || ''));
        }
        if (key === 'LastBrainstormed') {
          return new Date(right.LastBrainstormed || 0).getTime() - new Date(left.LastBrainstormed || 0).getTime();
        }
        return Number(right.PriorityScore || 0) - Number(left.PriorityScore || 0);
      };
    }

    function filterResources_(resources) {
      return resources.filter(function (resource) {
        if (App.state.ui.resourceType !== 'All Items' && resource.Type !== App.state.ui.resourceType) {
          return false;
        }
        if (App.state.ui.resourceStatus !== 'All Statuses' && resource.Status !== App.state.ui.resourceStatus) {
          return false;
        }
        if (App.state.ui.resourceSearch) {
          var haystack = [resource.Title, resource.Description, resource.Tags, resource.Type].join(' ').toLowerCase();
          if (haystack.indexOf(App.state.ui.resourceSearch.toLowerCase()) === -1) {
            return false;
          }
        }
        return true;
      });
    }

    function filterTasks_(tasks) {
      return tasks.filter(function (task) {
        if (App.state.ui.taskIdeaFilter !== 'All Ideas' && task.IdeaID !== App.state.ui.taskIdeaFilter) {
          return false;
        }
        if (App.state.ui.taskDueFilter === 'Overdue' && !task.IsOverdue) {
          return false;
        }
        if (App.state.ui.taskSearch) {
          var haystack = [task.Title, task.IdeaName, task.Tags, task.Assignee].join(' ').toLowerCase();
          if (haystack.indexOf(App.state.ui.taskSearch.toLowerCase()) === -1) {
            return false;
          }
        }
        return true;
      });
    }

    function parseHash_(hash) {
      var clean = String(hash || '#dashboard').replace(/^#/, '') || 'dashboard';
      var parts = clean.split('?');
      var path = parts[0];
      var query = parseQuery_(parts[1] || '');
      var segments = path.split('/').filter(Boolean);

      if (!segments.length || segments[0] === 'dashboard') {
        return { name: 'dashboard', root: 'dashboard', params: {}, query: query };
      }
      if (segments[0] === 'ideas' && segments[1] === 'new') {
        return { name: 'ideas-new', root: 'ideas', params: {}, query: query };
      }
      if (segments[0] === 'ideas' && segments[1]) {
        return { name: 'idea-detail', root: 'ideas', params: { id: decodeURIComponent(segments[1]) }, query: query };
      }
      if (segments[0] === 'ideas') {
        return { name: 'ideas', root: 'ideas', params: {}, query: query };
      }
      if (segments[0] === 'brainstorm' && segments[1] === 'history') {
        return { name: 'brainstorm-history', root: 'brainstorm', params: {}, query: query };
      }
      if (segments[0] === 'brainstorm') {
        return { name: 'brainstorm', root: 'brainstorm', params: {}, query: query };
      }
      if (segments[0] === 'resources') {
        return { name: 'resources', root: 'resources', params: {}, query: query };
      }
      if (segments[0] === 'tasks') {
        return { name: 'tasks', root: 'tasks', params: {}, query: query };
      }
      if (segments[0] === 'settings') {
        return { name: 'settings', root: 'settings', params: {}, query: query };
      }
      return { name: 'dashboard', root: 'dashboard', params: {}, query: query };
    }

    function parseQuery_(queryString) {
      return String(queryString || '')
        .split('&')
        .filter(Boolean)
        .reduce(function (accumulator, pair) {
          var parts = pair.split('=');
          accumulator[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
          return accumulator;
        }, {});
    }

    function hydrateActiveSessionFromProgress_(progress, fallbackMode) {
      var mode = progress.mode || fallbackMode || detectModeFromPersonas_(progress.personas || []);
      var personas =
        detectBrainstormPersonas_(progress.personas || []).length
          ? detectBrainstormPersonas_(progress.personas || [])
          : (BRAINSTORM_MODES[mode] ? BRAINSTORM_MODES[mode].personas.slice() : []);
      var ideaName = progress.idea && progress.idea.Name ? progress.idea.Name : '';
      var existingSession =
        App.state.activeSession && App.state.activeSession.sessionId === progress.sessionId ? App.state.activeSession : null;
      var autoplay = existingSession ? existingSession.autoplay !== false : !progress.complete;
      return {
        sessionId: progress.sessionId,
        ideaId: progress.ideaId,
        ideaName: ideaName,
        mode: mode,
        personas: personas.map(function (key) {
          return { key: key };
        }),
        turns: progress.turns || [],
        nextTurnIndex: (progress.turns || []).filter(function (turn) {
          return turn.Agent !== 'Synthesis';
        }).length,
        complete: !!progress.complete,
        synthesis: progress.synthesis || null,
        synthesisData: progress.synthesisData || null,
        loading: false,
        autoplay: autoplay && !progress.complete,
      };
    }

    function nextPersonaForSession_(session) {
      if (!session || session.complete) {
        return 'Synthesis';
      }
      var personas = session.personas.map(function (persona) {
        return typeof persona === 'string' ? persona : persona.key;
      });
      return personas[session.nextTurnIndex] || 'Synthesis';
    }

    function detectBrainstormPersonas_(personas) {
      if (!personas || !personas.length) {
        return [];
      }
      return personas
        .map(function (persona) {
          return typeof persona === 'string' ? persona : persona && persona.key ? persona.key : '';
        })
        .filter(Boolean);
    }

    function detectModeFromPersonas_(personas) {
      var normalized = detectBrainstormPersonas_(personas).slice().sort().join('|');
      return (
        Object.keys(BRAINSTORM_MODES).find(function (mode) {
          return BRAINSTORM_MODES[mode].personas.slice().sort().join('|') === normalized;
        }) || 'Full Roundtable'
      );
    }

    function parseSynthesis_(content) {
      if (!content) {
        return { summary: '', nextAction: '', suggestedStage: '', keyInsights: [] };
      }
      try {
        return JSON.parse(content);
      } catch (error) {
        var summaryMatch = content.match(/Summary:\s*([\s\S]*?)(?:\nNextAction:|\nNext Action:|$)/i);
        var nextActionMatch = content.match(/Next(?:\s)?Action:\s*([\s\S]*?)(?:\nSuggestedStage:|\nSuggested Stage:|$)/i);
        var stageMatch = content.match(/Suggested(?:\s)?Stage:\s*([^\n]+)/i);
        return {
          summary: summaryMatch ? summaryMatch[1].trim() : content.trim(),
          nextAction: nextActionMatch ? nextActionMatch[1].trim() : '',
          suggestedStage: stageMatch ? stageMatch[1].trim() : '',
          keyInsights: [],
        };
      }
    }

    function greetingForName_(name) {
      var hour = new Date().getHours();
      var prefix = hour < 12 ? 'Morning' : hour < 18 ? 'Afternoon' : 'Evening';
      return prefix + ', ' + (name || 'Alex') + '.';
    }

    function getAvatarBackgroundClass_(accent) {
      switch (accent) {
        case 'secondary':
          return 'bg-secondary';
        case 'tertiary':
          return 'bg-tertiary';
        case 'outline':
          return 'bg-outline';
        default:
          return 'bg-primary';
      }
    }

    function scoreToPercent_(score) {
      return Math.round(Number(score || 0) * 100);
    }

    function escapeHtml_(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate_(value) {
      if (!value) {
        return '';
      }
      var date = new Date(value);
      if (isNaN(date.getTime())) {
        return '';
      }
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function formatDateInput_(value) {
      if (!value) {
        return '';
      }
      var date = new Date(value);
      if (isNaN(date.getTime())) {
        return '';
      }
      return date.toISOString().slice(0, 10);
    }

    function formatDateTime_(value, timeOnly) {
      if (!value) {
        return '';
      }
      var date = new Date(value);
      if (isNaN(date.getTime())) {
        return '';
      }
      if (timeOnly) {
        return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      }
      return date.toLocaleString(undefined, {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
      });
    }

    function splitList_(value) {
      return String(value || '')
        .split(',')
        .map(function (item) {
          return item.trim();
        })
        .filter(Boolean);
    }

    function truncateText_(value, maxLength) {
      var normalized = String(value || '').replace(/\s+/g, ' ').trim();
      if (!maxLength || normalized.length <= maxLength) {
        return normalized;
      }
      return normalized.slice(0, maxLength - 3).replace(/\s+\S*$/, '') + '...';
    }

    function clampNumber_(value, min, max) {
      return Math.max(Number(min), Math.min(Number(max), Number(value)));
    }

    function countKeywordHits_(text, keywords) {
      return (keywords || []).reduce(function (count, keyword) {
        return count + (String(text || '').indexOf(keyword) > -1 ? 1 : 0);
      }, 0);
    }

    function formToObject_(form) {
      var data = {};
      Array.prototype.forEach.call(form.elements, function (element) {
        if (!element.name) {
          return;
        }
        if (element.type === 'checkbox') {
          data[element.name] = element.checked ? 'true' : 'false';
          return;
        }
        data[element.name] = element.value;
      });
      return data;
    }

    function populateForm_(form, data) {
      Array.prototype.forEach.call(form.elements, function (element) {
        if (!element.name || !Object.prototype.hasOwnProperty.call(data, element.name)) {
          return;
        }
        if (element.type === 'checkbox') {
          element.checked = String(data[element.name]) === 'true';
          return;
        }
        element.value = data[element.name] || '';
      });
    }

    function setFormBusy_(form, busy) {
      Array.prototype.forEach.call(form.querySelectorAll('button, input, select, textarea'), function (element) {
        element.disabled = busy;
      });
    }

    async function requestIdeaDraft_(form, brief, options) {
      options = options || {};
      setIdeaDraftStatus_(form, 'Drafting the structured spark from your brief...', 'info');
      var result = await AppApi.draftIdeaFromBrief(brief);
      applyIdeaDraftToForm_(form, result.draft || {});
      setIdeaDraftStatus_(
        form,
        result.fallbackUsed
          ? 'A structured fallback draft has been generated from your brief. Review and refine any field you want.'
          : 'The Roundtable filled the spark form from your brief. You can edit any field before saving.',
        result.fallbackUsed ? 'warning' : 'success'
      );
      if (!options.silentToast) {
        showToast_(result.fallbackUsed ? 'Draft ready with fallback guidance.' : 'Idea draft generated.', 'success');
      }
      return result;
    }

    async function requestIdeaBriefExpansion_(form, brief, options) {
      options = options || {};
      setIdeaDraftStatus_(form, 'Expanding your rough note into a richer idea brief...', 'info');
      var result = await AppApi.expandIdeaBrief(brief);
      var briefField = form ? form.querySelector('[data-idea-brief]') : null;
      if (briefField) {
        briefField.value = result.expandedBrief || brief;
        briefField.focus();
        briefField.setSelectionRange(briefField.value.length, briefField.value.length);
      }
      setIdeaDraftStatus_(
        form,
        result.fallbackUsed
          ? 'The brief was expanded with fallback guidance. Review it, then use Prefill With AI when you are ready.'
          : 'The brief has been expanded. Review it, then use Prefill With AI to structure the full spark.',
        result.fallbackUsed ? 'warning' : 'success'
      );
      if (!options.silentToast) {
        showToast_(result.fallbackUsed ? 'Brief expanded with fallback guidance.' : 'Brief expanded with AI.', 'success');
      }
      return result;
    }

    function applyIdeaDraftToForm_(form, draft) {
      populateForm_(form, {
        Name: draft.Name || '',
        Summary: draft.Summary || '',
        Category: draft.Category || 'Other',
        ProblemSolved: draft.ProblemSolved || '',
        TargetUsers: draft.TargetUsers || '',
        UniqueValue: draft.UniqueValue || '',
        Tags: draft.Tags || '',
        Stage: draft.Stage || 'Spark',
      });
      var nameField = form.querySelector('[name="Name"]');
      if (nameField && nameField.value) {
        nameField.focus();
      }
    }

    function setIdeaDraftStatus_(form, message, tone) {
      if (!form) {
        return;
      }
      var status = form.querySelector('[data-idea-draft-status]');
      if (!status) {
        return;
      }
      status.className =
        'rounded-lg px-4 py-3 text-sm ' +
        (tone === 'error'
          ? 'bg-error-container text-on-error-container'
          : tone === 'warning'
            ? 'bg-tertiary-container text-on-tertiary-container'
            : tone === 'success'
              ? 'bg-secondary-container text-on-secondary-container'
              : 'bg-surface-container-highest text-on-surface-variant');
      status.textContent = message;
    }

    function hideIdeaDraftStatus_(form) {
      if (!form) {
        return;
      }
      var status = form.querySelector('[data-idea-draft-status]');
      if (!status) {
        return;
      }
      status.className = 'hidden rounded-lg bg-surface-container-highest px-4 py-3 text-sm text-on-surface-variant';
      status.textContent = '';
    }

    function clearLiveBrainstormEffects_() {
      clearSessionAutoplayTimer_();
      clearTypingTimer_();
      App.state.liveTyping = null;
    }

    function clearSessionAutoplayTimer_() {
      if (App.state.sessionAutoplayTimer) {
        window.clearTimeout(App.state.sessionAutoplayTimer);
        App.state.sessionAutoplayTimer = null;
      }
    }

    function clearTypingTimer_() {
      if (App.state.typingTimer) {
        window.clearTimeout(App.state.typingTimer);
        App.state.typingTimer = null;
      }
    }

    function isActiveSessionTyping_() {
      return !!(
        App.state.liveTyping &&
        App.state.activeSession &&
        App.state.liveTyping.sessionId === App.state.activeSession.sessionId
      );
    }

    function sessionTurnKey_(turn) {
      return [
        turn.Agent || '',
        turn.Timestamp || '',
        truncateText_(turn.Content || '', 48),
      ].join('|');
    }

    function getTypingStateForTurn_(turn) {
      if (!App.state.liveTyping || !turn) {
        return null;
      }
      return App.state.liveTyping.turnKey === sessionTurnKey_(turn) ? App.state.liveTyping : null;
    }

    function getLatestSpokenTurn_(session) {
      return (session && session.turns ? session.turns : [])
        .filter(function (turn) {
          return turn.Agent !== 'Synthesis';
        })
        .slice(-1)[0] || null;
    }

    function beginTurnTypewriter_(session, turn) {
      if (!session || !turn) {
        return;
      }
      var fullText = String(turn.Content || '');
      if (!fullText) {
        if (session.autoplay !== false && !session.complete) {
          scheduleSessionAutoplay_(600);
        }
        return;
      }

      clearTypingTimer_();
      App.state.liveTyping = {
        sessionId: session.sessionId,
        turnKey: sessionTurnKey_(turn),
        fullText: fullText,
        displayedLength: 0,
      };

      function tick() {
        var typing = App.state.liveTyping;
        if (!typing || typing.sessionId !== session.sessionId) {
          return;
        }
        var remaining = typing.fullText.length - typing.displayedLength;
        if (remaining <= 0) {
          clearTypingTimer_();
          App.state.liveTyping = null;
          renderBrainstormRoute_(App.state.route || parseHash_(window.location.hash), false);
          if (App.state.activeSession && App.state.activeSession.sessionId === session.sessionId) {
            if (App.state.activeSession.complete) {
              showToast_('Roundtable session complete. Synthesis is ready.', 'success');
            } else if (App.state.activeSession.autoplay !== false) {
              scheduleSessionAutoplay_(650);
            }
          }
          return;
        }

        typing.displayedLength += Math.max(1, Math.min(4, Math.ceil(typing.fullText.length / 90)));
        renderBrainstormRoute_(App.state.route || parseHash_(window.location.hash), false);
        App.state.typingTimer = window.setTimeout(tick, remaining > 80 ? 18 : 26);
      }

      renderBrainstormRoute_(App.state.route || parseHash_(window.location.hash), false);
      App.state.typingTimer = window.setTimeout(tick, 60);
    }

    function scheduleSessionAutoplay_(delayMs) {
      clearSessionAutoplayTimer_();
      var session = App.state.activeSession;
      var route = App.state.route || parseHash_(window.location.hash);
      if (!session || session.complete || session.loading || session.autoplay === false || isActiveSessionTyping_()) {
        return;
      }
      if (
        route.name !== 'brainstorm' ||
        (route.query.sessionId && String(route.query.sessionId || '') !== String(session.sessionId || ''))
      ) {
        return;
      }
      App.state.sessionAutoplayTimer = window.setTimeout(function () {
        App.state.sessionAutoplayTimer = null;
        runNextSessionTurn_();
      }, Number(delayMs || App.state.brainstormAutoDelayMs));
    }

    function showToast_(message, tone) {
      var root = document.getElementById('toast-root');
      var toast = document.createElement('div');
      toast.className =
        'pointer-events-auto max-w-sm rounded-xl px-4 py-3 ambient-shadow text-sm ' +
        (tone === 'error'
          ? 'bg-error-container text-on-error-container'
          : 'bg-surface-container-lowest text-on-surface');
      toast.innerHTML =
        '<div class="flex items-start gap-3"><span class="material-symbols-outlined text-lg">' +
        (tone === 'error' ? 'error' : 'check_circle') +
        '</span><div>' +
        escapeHtml_(message) +
        '</div></div>';
      root.appendChild(toast);
      window.setTimeout(function () {
        toast.remove();
      }, 3200);
    }

    function applyTheme_(isDark) {
      document.documentElement.classList.toggle('dark', !!isDark);
    }

    function renderMobileNavModal_() {
      var route = App.state.route || parseHash_(window.location.hash);
      return [
        '<div class="pointer-events-auto mx-auto max-w-sm w-full mt-10 bg-surface-container-lowest rounded-xl ambient-shadow p-4 space-y-4">',
        '<div class="flex items-center justify-between"><div class="font-headline text-2xl font-bold tracking-tight">Navigation</div><button type="button" data-action="close-modal" class="text-outline hover:text-on-surface"><span class="material-symbols-outlined">close</span></button></div>',
        NAV_ITEMS.map(function (item) {
          var active = route.root === item.key;
          return '<button type="button" data-nav="' + item.hash + '" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg ' + (active ? 'bg-surface-container-highest text-primary' : 'text-on-surface-variant hover:bg-surface-container-low') + '"><span class="material-symbols-outlined ' + (active ? 'fill' : '') + '">' + item.icon + '</span>' + escapeHtml_(item.label) + '</button>';
        }).join(''),
        '<button type="button" data-nav="#ideas/new" class="w-full px-4 py-3 rounded-lg bg-gradient-primary text-on-primary font-medium">New Spark</button>',
        '</div>',
      ].join('');
    }
  })();
</script>
