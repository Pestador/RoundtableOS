<template id="template-resources">
  <section class="p-6 md:p-10 lg:p-12 max-w-7xl mx-auto w-full space-y-8">
    <header class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
      <div>
        <h1 class="font-headline text-4xl font-extrabold tracking-tight">Resource Vault</h1>
        <p class="text-on-surface-variant text-lg mt-2">
          Manage and discover essential assets across the OS.
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <label class="relative min-w-[260px]">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg">search</span>
          <input
            type="search"
            data-resource-search
            placeholder="Search resources..."
            class="w-full bg-surface-container-highest rounded-full pl-10 pr-4 py-3 focus-ring"
          />
        </label>
        <button
          type="button"
          data-action="open-resource-modal"
          class="px-5 py-3 rounded-lg bg-gradient-primary text-on-primary ambient-shadow font-medium hover:opacity-90 transition-all duration-200 ease-in-out"
        >
          Add Resource
        </button>
      </div>
    </header>

    <div class="editorial-card p-5 space-y-5">
      <div class="flex flex-col xl:flex-row gap-4 xl:items-center xl:justify-between">
        <div class="inline-flex bg-surface-container-highest rounded-lg p-1">
          <button
            type="button"
            data-resources-view="cards"
            class="px-4 py-2 rounded-md text-sm font-medium text-primary bg-surface-container-lowest shadow-sm"
          >
            Cards
          </button>
          <button
            type="button"
            data-resources-view="list"
            class="px-4 py-2 rounded-md text-sm font-medium text-on-surface-variant hover:text-on-surface transition-all duration-200 ease-in-out"
          >
            List
          </button>
        </div>

        <div
          class="flex flex-wrap items-center gap-2"
          data-resource-type-filters
        ></div>
      </div>

      <div
        class="flex flex-wrap gap-2"
        data-resource-status-filters
      ></div>
    </div>

    <div
      data-resources-empty
      class="hidden editorial-card p-10 text-center"
    ></div>

    <div
      data-resources-cards
      class="grid md:grid-cols-2 xl:grid-cols-4 gap-5"
    ></div>

    <div
      data-resources-list
      class="hidden editorial-card overflow-hidden"
    ></div>
  </section>
</template>
