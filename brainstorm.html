<template id="template-brainstorm">
  <section class="p-6 md:p-10 lg:p-12 max-w-7xl mx-auto w-full">
    <div
      data-brainstorm-launcher
      class="space-y-8"
    >
      <header class="space-y-3">
        <h1 class="font-headline text-4xl font-extrabold tracking-tight">Brainstorming</h1>
        <p class="text-on-surface-variant text-lg max-w-3xl">
          Launch structured roundtable sessions, let persona turns progress automatically, and turn synthesis into decisive next actions.
        </p>
      </header>

      <div class="grid lg:grid-cols-[minmax(0,1fr)_320px] gap-8 items-start">
        <form
          id="brainstorm-launch-form"
          class="editorial-card p-8 space-y-8"
        >
          <div class="space-y-3">
            <label class="block space-y-2">
              <span class="text-xs uppercase tracking-[0.12em] font-medium">Idea</span>
              <select
                name="ideaId"
                data-brainstorm-idea-select
                class="w-full bg-surface-container-highest rounded-lg px-5 py-4 text-lg focus-ring"
              ></select>
            </label>
          </div>

          <div class="space-y-4">
            <span class="text-xs uppercase tracking-[0.12em] font-medium block">Brainstorm Mode</span>
            <div
              class="grid md:grid-cols-2 gap-4"
              data-brainstorm-mode-grid
            ></div>
          </div>

          <div class="flex items-center justify-between gap-4">
            <p class="text-sm text-on-surface-variant max-w-xl">
              Sessions write each persona turn to the Sheets-backed log in real time, auto-progress through every voice, then finish with a synthesis and updated priority score.
            </p>
            <button
              type="submit"
              class="px-6 py-3 rounded-lg bg-gradient-primary text-on-primary ambient-shadow font-medium hover:opacity-90 transition-all duration-200 ease-in-out shrink-0"
            >
              Launch Session
            </button>
          </div>
        </form>

        <aside class="space-y-4">
          <div class="editorial-card p-6 space-y-4">
            <h2 class="font-headline text-2xl font-bold tracking-tight">Mode Guide</h2>
            <div
              class="space-y-3 text-sm text-on-surface-variant"
              data-brainstorm-mode-guide
            ></div>
          </div>
          <div class="editorial-card p-6 space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="font-headline text-2xl font-bold tracking-tight">Recent Sessions</h2>
              <button
                type="button"
                data-nav="#brainstorm/history"
                class="text-primary text-sm font-medium hover:underline"
              >
                View all
              </button>
            </div>
            <div
              class="space-y-3"
              data-brainstorm-launcher-recent
            ></div>
          </div>
        </aside>
      </div>
    </div>

    <div
      data-brainstorm-session
      class="hidden"
    ></div>

    <div
      data-brainstorm-history
      class="hidden space-y-8"
    ></div>
  </section>
</template>
