<template id="template-tasks">
  <section class="p-6 md:p-10 lg:p-12 max-w-7xl mx-auto w-full space-y-8">
    <header class="flex flex-col xl:flex-row xl:items-center justify-between gap-4">
      <div>
        <h1 class="font-headline text-4xl font-extrabold tracking-tight">Task Manager</h1>
        <p class="text-on-surface-variant text-lg mt-2">
          Track execution across all active sparks.
        </p>
      </div>
      <div class="flex flex-col sm:flex-row gap-3">
        <label class="relative min-w-[260px]">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg">search</span>
          <input
            type="search"
            data-task-search
            placeholder="Filter tasks..."
            class="w-full bg-surface-container-highest rounded-lg pl-10 pr-4 py-3 focus-ring"
          />
        </label>
        <button
          type="button"
          data-action="open-task-modal"
          class="px-5 py-3 rounded-lg bg-gradient-primary text-on-primary ambient-shadow font-medium hover:opacity-90 transition-all duration-200 ease-in-out"
        >
          Create Task
        </button>
      </div>
    </header>

    <div
      class="flex flex-wrap gap-2"
      data-task-filter-pills
    ></div>

    <div
      data-tasks-board
      class="overflow-x-auto hide-scrollbar"
    ></div>
  </section>
</template>
