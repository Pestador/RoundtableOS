<template id="template-new-spark">
  <section class="p-6 md:p-10 lg:p-12 max-w-7xl mx-auto w-full space-y-8">
    <div class="text-sm text-on-surface-variant flex items-center gap-2">
      <button
        type="button"
        data-nav="#ideas"
        class="hover:text-primary transition-all duration-200 ease-in-out"
      >
        Ideas
      </button>
      <span>›</span>
      <span class="text-on-surface">Capture Spark</span>
    </div>

    <div class="max-w-4xl mx-auto space-y-8">
      <div class="space-y-3">
        <h1 class="font-headline text-5xl font-extrabold tracking-tight">Capture a Spark</h1>
        <p class="text-2xl text-on-surface-variant leading-relaxed max-w-3xl">
          Record a new concept for the Roundtable to analyze. The more context you provide, the sharper the insights will be.
        </p>
      </div>

      <form
        id="new-idea-form"
        novalidate
        class="editorial-card p-8 md:p-12 space-y-8"
      >
        <section class="space-y-5">
          <div class="rounded-xl bg-surface-container-low p-6 space-y-5">
            <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-4">
              <div class="space-y-2 max-w-2xl">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-primary-container text-on-primary-container text-xs uppercase tracking-[0.12em] font-medium">
                  <span class="material-symbols-outlined text-sm">auto_awesome</span>
                  AI Intake Drafting
                </div>
                <h2 class="font-headline text-2xl font-bold tracking-tight">Start rough, then let the app structure it.</h2>
                <p class="text-on-surface-variant text-base leading-relaxed">
                  Paste a short idea description and the Roundtable can prefill the form before you save. You still keep full control over every field.
                </p>
              </div>
              <div class="text-sm text-on-surface-variant lg:max-w-xs">
                Include the user, the problem, and the format if you know it. The clearer the brief, the better the first draft.
              </div>
            </div>

            <label class="block space-y-2">
              <span class="text-xs uppercase tracking-[0.12em] font-medium text-on-surface">Raw Idea Brief</span>
              <div class="relative">
                <textarea
                  name="IdeaBrief"
                  rows="4"
                  data-idea-brief
                  placeholder="Example: I want an AI operating system for founders where I can dump a messy startup idea, have the app structure the opportunity, run a live brainstorm with multiple specialist agents, and then turn the result into concrete tasks and resources."
                  class="w-full bg-surface-container-highest rounded-lg px-5 py-4 pr-16 pb-14 text-base placeholder:text-outline focus-ring resize-y"
                ></textarea>
                <button
                  type="button"
                  data-action="expand-idea-brief"
                  title="Expand this brief with AI"
                  aria-label="Expand this brief with AI"
                  class="absolute right-4 bottom-4 w-10 h-10 rounded-full bg-surface-container-lowest/80 text-primary/80 backdrop-blur ghost-border ambient-shadow hover:bg-surface-container-lowest hover:text-primary transition-all duration-200 ease-in-out flex items-center justify-center"
                >
                  <span class="material-symbols-outlined text-[20px]">auto_fix_high</span>
                </button>
              </div>
            </label>

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              <div class="text-sm text-on-surface-variant">The draft fills name, summary, problem, users, value, category, stage, and tags.</div>
              <div class="flex flex-wrap gap-3">
                <button
                  type="button"
                  data-action="clear-idea-brief-draft"
                  class="px-5 py-3 rounded-lg ghost-border text-primary font-medium hover:bg-surface-container-low transition-all duration-200 ease-in-out"
                >
                  Clear Draft
                </button>
                <button
                  type="button"
                  data-action="draft-idea-brief"
                  class="px-6 py-3 rounded-lg bg-gradient-primary text-on-primary ambient-shadow font-medium hover:opacity-90 transition-all duration-200 ease-in-out inline-flex items-center gap-2"
                >
                  <span class="material-symbols-outlined text-lg">auto_awesome</span>
                  Prefill With AI
                </button>
              </div>
            </div>

            <div
              data-idea-draft-status
              class="hidden rounded-lg bg-surface-container-highest px-4 py-3 text-sm text-on-surface-variant"
            ></div>
          </div>
        </section>

        <div class="space-y-4 border-t border-outline-variant/15 pt-8">
          <label class="block space-y-2">
            <span class="text-xs uppercase tracking-[0.12em] font-medium text-on-surface">Idea Name</span>
            <input
              name="Name"
              type="text"
              placeholder="e.g., Project Phoenix"
              class="w-full bg-surface-container-highest rounded-lg px-5 py-4 text-2xl placeholder:text-outline focus-ring"
            />
          </label>

          <label class="block space-y-2">
            <span class="text-xs uppercase tracking-[0.12em] font-medium text-on-surface">Summary</span>
            <textarea
              name="Summary"
              rows="4"
              placeholder="Briefly describe the concept..."
              class="w-full bg-surface-container-highest rounded-lg px-5 py-4 text-xl placeholder:text-outline focus-ring resize-y"
            ></textarea>
          </label>
        </div>

        <div class="border-t border-outline-variant/15 pt-8 space-y-6">
          <label class="block space-y-2">
            <span class="text-xs uppercase tracking-[0.12em] font-medium text-on-surface">Problem Solved</span>
            <textarea
              name="ProblemSolved"
              rows="4"
              placeholder="What pain point does this address?"
              class="w-full bg-surface-container-highest rounded-lg px-5 py-4 text-xl placeholder:text-outline focus-ring resize-y"
            ></textarea>
          </label>

          <div class="grid md:grid-cols-2 gap-6">
            <label class="block space-y-2">
              <span class="text-xs uppercase tracking-[0.12em] font-medium text-on-surface">Target Users</span>
              <input
                name="TargetUsers"
                type="text"
                placeholder="e.g., Remote freelancers"
                class="w-full bg-surface-container-highest rounded-lg px-5 py-4 text-xl placeholder:text-outline focus-ring"
              />
            </label>

            <label class="block space-y-2">
              <span class="text-xs uppercase tracking-[0.12em] font-medium text-on-surface">Unique Value</span>
              <input
                name="UniqueValue"
                type="text"
                placeholder="The key differentiator"
                class="w-full bg-surface-container-highest rounded-lg px-5 py-4 text-xl placeholder:text-outline focus-ring"
              />
            </label>
          </div>
        </div>

        <div class="border-t border-outline-variant/15 pt-8 grid md:grid-cols-3 gap-6">
          <label class="block space-y-2">
            <span class="text-xs uppercase tracking-[0.12em] font-medium text-on-surface">Category</span>
            <select
              name="Category"
              class="w-full bg-surface-container-highest rounded-lg px-5 py-4 text-xl focus-ring"
            >
              <option>Product</option>
              <option>Service</option>
              <option>Research</option>
              <option>Content</option>
              <option>Tool</option>
              <option selected>Other</option>
            </select>
          </label>

          <label class="block space-y-2">
            <span class="text-xs uppercase tracking-[0.12em] font-medium text-on-surface">Stage</span>
            <select
              name="Stage"
              class="w-full bg-surface-container-highest rounded-lg px-5 py-4 text-xl focus-ring"
            >
              <option>Inbox</option>
              <option selected>Spark</option>
              <option>Exploring</option>
              <option>Validating</option>
              <option>Planned</option>
              <option>Building</option>
              <option>Launched</option>
              <option>Paused</option>
              <option>Archived</option>
              <option>Killed</option>
            </select>
          </label>

          <label class="block space-y-2">
            <span class="text-xs uppercase tracking-[0.12em] font-medium text-on-surface">Tags</span>
            <input
              name="Tags"
              type="text"
              placeholder="Comma separated"
              class="w-full bg-surface-container-highest rounded-lg px-5 py-4 text-xl placeholder:text-outline focus-ring"
            />
          </label>
        </div>

        <div class="flex items-center justify-end gap-4 pt-2">
          <button
            type="button"
            data-nav="#ideas"
            class="px-6 py-3 rounded-lg ghost-border text-primary font-medium hover:bg-surface-container-low transition-all duration-200 ease-in-out"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="px-7 py-3 rounded-lg bg-gradient-primary text-on-primary ambient-shadow font-medium hover:opacity-90 transition-all duration-200 ease-in-out inline-flex items-center gap-2"
          >
            <span class="material-symbols-outlined text-lg">save</span>
            Save Idea
          </button>
        </div>
      </form>

      <div class="bg-surface-container-low editorial-card !shadow-none p-5 flex gap-4 items-start">
        <div class="w-8 h-8 rounded-full bg-secondary text-on-secondary flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-lg">info</span>
        </div>
        <p class="text-on-surface-variant text-lg leading-relaxed">
          Once saved, your spark will appear in the idea bank. You can then summon the Roundtable personas to brainstorm and expand the concept.
        </p>
      </div>
    </div>
  </section>
</template>
